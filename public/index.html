<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Demo Empresas y Empleados</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >

  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Empresas & Empleados</span>
    </div>
  </nav>

  <div class="container">
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            Crear empresa
          </div>
          <div class="card-body">
            <form id="formEmpresa">
              <div class="mb-3">
                <label for="nombreEmpresa" class="form-label">Nombre de la empresa</label>
                <input type="text" class="form-control" id="nombreEmpresa" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">
                Guardar empresa
              </button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-8">
        <div class="card shadow-sm mb-3">
          <div class="card-header bg-secondary text-white">
            Empresa seleccionada
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label for="empresaSelect" class="form-label">Selecciona una empresa</label>
              <select id="empresaSelect" class="form-select">
              </select>
            </div>

            <hr>

            <h5 class="mb-3">Agregar empleado a la empresa seleccionada</h5>
            <form id="formEmpleado">
              <div class="row g-3">
                <div class="col-md-4">
                  <label for="nombreEmpleado" class="form-label">Nombre</label>
                  <input type="text" id="nombreEmpleado" class="form-control" required>
                </div>
                <div class="col-md-4">
                  <label for="cargoEmpleado" class="form-label">Cargo</label>
                  <input type="text" id="cargoEmpleado" class="form-control">
                </div>
                <div class="col-md-4">
                  <label for="emailEmpleado" class="form-label">Email</label>
                  <input type="email" id="emailEmpleado" class="form-control">
                </div>
              </div>
              <div class="mt-3 text-end">
                <button type="submit" class="btn btn-success">
                  Guardar empleado
                </button>
              </div>
            </form>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-header bg-info text-dark">
            Empleados de la empresa seleccionada
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-striped align-middle">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Cargo</th>
                    <th>Email</th>
                    <th>Creado</th>
                  </tr>
                </thead>
                <tbody id="tbodyEmpleados">
                  <tr>
                    <td colspan="5" class="text-center text-muted">
                      No hay empleados para esta empresa.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div id="alertPlaceholder" class="mt-3"></div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <script src="principal.js"></script>
</body>
</html>
